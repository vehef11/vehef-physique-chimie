<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Identifier le dioxygène — test à la buchette incandescente</title>
<style>
:root{--bg:#eef0ea;--panel:#f7f5ee;--text:#211d16;--muted:#736a5b;--accent:#ff7a30;--ok:#1f9d64;--bad:#d94b4b;}
@media (prefers-color-scheme: dark){
 :root:not([data-mode="light"]){--bg:#11161d;--panel:#1c232c;--text:#f1efe9;--muted:#98a1ac;}
}
:root[data-mode="dark"]{--bg:#11161d;--panel:#1c232c;--text:#f1efe9;--muted:#98a1ac;}
:root[data-mode="light"]{--bg:#eef0ea;--panel:#f7f5ee;--text:#211d16;--muted:#736a5b;}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
#app{display:flex;flex-direction:column;min-height:100%;}
#tabs{display:flex;gap:6px;padding:12px 12px 6px;}
.tab{flex:1;text-align:center;padding:9px 4px;border-radius:10px;background:var(--panel);color:var(--muted);
 font-size:11.5px;font-weight:500;border:1px solid transparent;}
.tab.active{color:var(--accent);border-color:var(--accent);}
#viewport{position:relative;aspect-ratio:4/3;width:calc(100% - 24px);max-width:640px;margin:6px auto;border-radius:16px;overflow:hidden;
 background:radial-gradient(ellipse at 50% 30%,#3c4658,#141a22 74%);}
#viewport canvas{position:absolute;inset:0;z-index:1;display:block;width:100%;height:100%;touch-action:none;}
#bgLayer{position:absolute;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 30%,#3c4658,#141a22 74%);}
#quizOverlay{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:8px;pointer-events:none;}
#quizOptions{display:flex;flex-wrap:nowrap;gap:5px;}
#quizOptions button{pointer-events:auto;flex:1 1 0;min-width:0;padding:9px 3px;font-size:clamp(9.5px,2.7vw,12px);line-height:1.15;
 border-radius:9px;background:rgba(15,20,28,.8);color:#fff;border:1px solid rgba(255,255,255,.35);text-align:center;overflow-wrap:anywhere;}
#panel{flex:1;padding:6px 16px 28px;display:flex;flex-direction:column;gap:12px;}
.step{display:none;flex-direction:column;gap:12px;}
.step.active{display:flex;}
h2{font-size:16px;font-weight:500;margin:4px 0 0;}
p{font-size:13.5px;line-height:1.6;color:var(--muted);margin:0;}
button{font:inherit;font-weight:500;font-size:14px;padding:13px 16px;border-radius:12px;border:none;
 background:var(--accent);color:#241100;}
button.secondary{background:var(--panel);color:var(--text);border:1px solid var(--muted);}
button:disabled{opacity:.35;}
.row{display:flex;gap:10px;align-items:center;}
.stack{display:flex;flex-direction:column;gap:8px;}
input[type=range]{width:100%;}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--panel);font-size:12px;
 color:var(--muted);border:1px solid var(--muted);white-space:nowrap;}
.obs{background:var(--panel);border-left:3px solid var(--accent);padding:10px 12px;border-radius:8px;font-size:13.5px;}
.dots{display:flex;gap:6px;justify-content:center;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--panel);border:1px solid var(--muted);}
.dot.on{background:var(--accent);border-color:var(--accent);}
.results{font-size:13px;color:var(--ok);min-height:18px;}
.quizQ{font-size:14.5px;font-weight:600;color:var(--text);margin:2px 0;}
#quizOptions button.correct{background:var(--ok);color:#fff;}
#quizOptions button.wrong{background:var(--bad);color:#fff;}
#quizTitle{text-align:center;margin:0 0 7px;font-size:clamp(11px,3.1vw,14.5px);font-weight:600;color:#ffe3e3;letter-spacing:.2px;
 text-shadow:0 0 3px #ff4a4a,0 0 8px #ff2a2a,0 0 16px rgba(255,30,30,.7);}
.step>button{align-self:center;width:min(100%,380px);}
#introButtons{display:flex;flex-direction:row;flex-wrap:nowrap;gap:8px;justify-content:center;width:100%;}
#introButtons button{flex:1 1 0;min-width:0;max-width:300px;padding:13px 8px;font-size:13.5px;}
#gasChoices,#heatChoices{align-self:center;width:min(100%,460px);}
#retryGasRow{display:flex;flex-direction:row;flex-wrap:nowrap;gap:8px;align-self:center;width:min(100%,460px);}
#retryGasRow button{flex:1 1 0;min-width:0;padding:13px 6px;}
#heatChoices{flex-direction:row;flex-wrap:nowrap;gap:8px;}
#heatChoices button{flex:1 1 0;min-width:0;padding:13px 6px;font-size:13px;}
#mixRow{width:100%;}
#obs2,#obs3{position:absolute;left:10px;right:10px;bottom:10px;z-index:6;margin:0;padding:8px 12px;border:none;border-radius:10px;
 background:rgba(10,14,20,.6);color:#ffe3e3;text-align:center;font-size:clamp(11px,3vw,14px);font-weight:600;line-height:1.3;pointer-events:none;
 text-shadow:0 0 3px #ff4a4a,0 0 8px #ff2a2a,0 0 14px rgba(255,30,30,.6);}
#bilanOverlay{position:absolute;inset:0;z-index:6;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;padding:12px 10px 10px;background:rgba(8,12,18,.55);}
#videoRow{display:flex;flex-wrap:nowrap;justify-content:center;gap:8px;width:100%;flex:1 1 0;min-height:0;}
#videoRow figure{margin:0;flex:1 1 0;min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:center;text-align:center;color:#fff;}
#videoRow img{flex:0 1 auto;min-height:0;width:100%;height:auto;max-height:calc(100% - 24px);object-fit:contain;border-radius:10px;display:block;}
#videoRow figcaption{margin-top:4px;font-weight:700;font-size:13px;}
#bilanText{text-align:center;font-weight:700;margin:0;max-width:96%;flex:0 0 auto;color:#ffe3e3;font-size:clamp(13px,3.4vw,18px);line-height:1.35;
 text-shadow:0 0 3px #ff4a4a,0 0 8px #ff2a2a,0 0 16px rgba(255,30,30,.6);}

/* --- quiz bilan --- */
#videoRow img{max-height:calc(100% - 58px) !important;}
#videoRow .bilanBtn{pointer-events:auto;margin-top:6px;padding:7px 3px;font-size:clamp(9px,2.5vw,12px);line-height:1.15;font-weight:700;border-radius:9px;
 background:rgba(15,20,28,.88);color:#fff;border:1px solid rgba(255,255,255,.45);width:100%;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center;}
#videoRow .bilanBtn .f{font-size:clamp(12px,3.4vw,16px);}
#videoRow .bilanBtn .n{font-weight:500;font-size:clamp(8.5px,2.3vw,11px);opacity:.9;}
#videoRow .bilanBtn.correct{background:var(--ok);border-color:#9dffc8;color:#fff;}
#videoRow .bilanBtn.wrong{background:var(--bad);border-color:#ffb0b0;color:#fff;}
#videoRow .bilanBtn:disabled{opacity:1;}
#videoRow .bilanBtn:disabled:not(.correct):not(.wrong){opacity:.45;}
#faceOverlay{position:absolute;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:4px;
 background:rgba(6,10,16,.72);pointer-events:auto;cursor:pointer;}
#faceOverlay.show{display:flex;}
#faceArt{height:80%;width:100%;display:flex;align-items:center;justify-content:center;}
#faceOverlay svg{height:100%;width:auto;max-width:92%;overflow:visible;}
#faceOverlay.ok svg{filter:drop-shadow(0 0 3px #39ff6a) drop-shadow(0 0 10px #39ff6a) drop-shadow(0 0 24px #1fff5a);animation:facePop .55s cubic-bezier(.3,1.6,.5,1) both,faceWiggle .5s ease-in-out .55s infinite alternate;}
#faceOverlay.ko svg{filter:drop-shadow(0 0 3px #ff3b3b) drop-shadow(0 0 10px #ff3b3b) drop-shadow(0 0 24px #ff1f1f);animation:facePop .5s ease-out both,faceSway 1.6s ease-in-out .5s infinite alternate;}
#faceCaption{font-weight:800;font-size:clamp(14px,4vw,22px);letter-spacing:.3px;}
#faceOverlay.ok #faceCaption{color:#d8ffe6;text-shadow:0 0 4px #39ff6a,0 0 12px #39ff6a,0 0 24px #1fff5a;}
#faceOverlay.ko #faceCaption{color:#ffe3e3;text-shadow:0 0 4px #ff3b3b,0 0 12px #ff3b3b,0 0 24px #ff1f1f;}
@keyframes facePop{0%{transform:scale(.1) rotate(-25deg);opacity:0;}100%{transform:scale(1) rotate(0);opacity:1;}}
@keyframes faceWiggle{0%{transform:rotate(-5deg) scale(1);}100%{transform:rotate(5deg) scale(1.05);}}
@keyframes faceSway{0%{transform:translateY(0) rotate(-2deg);}100%{transform:translateY(6px) rotate(2deg);}}

#bilanOverlay{background:radial-gradient(ellipse at 50% 30%,rgba(60,70,88,.98),rgba(14,20,28,.99) 75%) !important;justify-content:center !important;gap:22px !important;padding:14px 12px !important;}
#videoRow{flex:0 1 auto !important;align-items:stretch !important;gap:10px !important;}
#videoRow .bilanBtn{margin-top:0 !important;padding:20px 4px !important;width:auto !important;flex:1 1 0;justify-content:center;}
#videoRow .bilanBtn .f{font-size:clamp(18px,5.5vw,28px) !important;}
#videoRow .bilanBtn .n{font-size:clamp(10px,2.8vw,13px) !important;}
#bilanText{font-size:clamp(14px,3.8vw,20px) !important;}
#videoRow .bilanBtn .t{font-size:clamp(12px,3.4vw,16px);font-weight:700;line-height:1.25;}
#videoRow .bilanBtn:has(.t){padding:13px 10px !important;}
#faceSub{font-weight:600;font-size:clamp(10px,2.8vw,13px);color:#fff;text-align:center;max-width:90%;line-height:1.3;opacity:.95;}
.tab{cursor:pointer;}
#heatingRow,#heatingRowMix{position:absolute;top:10px;right:10px;z-index:6;gap:6px;pointer-events:none;}
#heatingRow .pill,#heatingRowMix .pill{background:rgba(15,20,28,.82);color:#fff;border:1px solid rgba(255,255,255,.4);font-weight:600;}
#mixRow input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:14px;border-radius:7px;outline:none;
 background:linear-gradient(90deg,#1fd0c0 0,#1fd0c0 var(--p,50%),#ff5fa8 var(--p,50%),#ff5fa8 100%);}
#mixRow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid #333;cursor:pointer;}
#mixRow input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid #333;cursor:pointer;}
#gasChoices{display:flex;flex-direction:row;flex-wrap:nowrap;gap:8px;}
#gasChoices button{flex:1 1 0;min-width:0;padding:13px 4px;}
</style>
</head>
<body>
<div id="app">
 <div id="tabs">
  <div class="tab active" data-i="0">1 · Matériel</div>
  <div class="tab" data-i="1">2 · Identification</div>
  <div class="tab" data-i="2">3 · Bilan</div>
  <div class="tab" data-i="3">4 · Bonus</div>
 </div>
 <div id="viewport"><div id="bgLayer"></div><div id="bilanOverlay" style="display:none"><p id="bilanText">Quel gaz permet de raviver les combustions ?</p>
   <div id="videoRow"></div></div><div id="faceOverlay"><div id="faceArt"></div><div id="faceCaption"></div><div id="faceSub"></div></div><div class="obs" id="obs2" style="display:none"></div><div class="obs" id="obs3" style="display:none"></div><div class="row" id="heatingRow" style="display:none"><span class="pill">Chauffe…</span><span class="pill" id="heatPct2">0%</span></div><div class="row" id="heatingRowMix" style="display:none"><span class="pill">Chauffe…</span><span class="pill" id="heatPctMix">0%</span></div><div id="quizOverlay"><div id="quizTitle" style="display:none">C'est quoi ça ? (tu peux tourner et zoomer)</div><div id="quizOptions"></div></div></div>
 <div id="panel">

  <div class="step active" data-s="0">
   <div id="introButtons">
    <button id="startPresent">Présentation des objets</button>
    <button id="toStep1" disabled>Passer à l'identification</button>
   </div>
   <div id="introPresent" style="display:none">
    <div class="dots" id="dots"></div>
    <div class="results" id="quizResult"></div>
   </div>
  </div>

  <div class="step" data-s="1">
   <p id="protoText" style="display:none"></p>
   <div id="gasChoices">
    <button id="fillH2" class="secondary">Mettre H₂</button>
    <button id="fillCO2" class="secondary">Mettre CO₂</button>
    <button id="fillO2">Mettre O₂</button>
   </div>
   <button id="btnClose2" style="display:none">Fermer le bocal</button>
   <button id="btnIgniteBurner" style="display:none">Allumer le bec Bunsen</button>
   <div id="heatChoices" style="display:none">
    <button id="heatSplint">Chauffer la bûchette</button>
    <button id="heatCharcoal" class="secondary">Chauffer le charbon de bois</button>
   </div>
   <button id="btnPlunge2" style="display:none">Mettre dans le bocal</button>
   <button id="btnShake2" style="display:none">Refermer et agiter</button>
   <div id="retryGasRow" style="display:none">
    <button id="retryGasA"></button>
    <button id="retryGasB"></button>
   </div>
   <button id="toStep2" disabled>Passer au bilan</button>
  </div>

  <div class="step" data-s="2">
   <button id="toBonus">Passer au test amusant</button>
   <button id="restartBtn" class="secondary">Recommencer l'expérience</button>
  </div>

  <div class="step" data-s="3">
   <div class="row" id="mixRow"><span class="pill" id="o2mixval" style="border-color:#1fd0c0;color:#1fd0c0">O₂ 50%</span><input type="range" id="o2mix" min="0" max="100" value="50"><span class="pill" id="h2mixval" style="border-color:#ff5fa8;color:#ff5fa8">H₂ 50%</span></div>
   <button id="fillMix">Remplir le bocal</button>
   <button id="closeMix" style="display:none">Fermer le bocal</button>
   <button id="igniteBurnerMix" style="display:none">Allumer le bec Bunsen</button>
   <button id="heatSplintMix" style="display:none">Chauffer la bûchette</button>
   <button id="plungeMix" style="display:none">Plonger la bûchette dans le bocal</button>
   <button id="retryMix" class="secondary" style="display:none">Réessayer</button>
  </div>

 </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var gen=0;
(function(){var st=window.setTimeout.bind(window),si=window.setInterval.bind(window);
 window.setTimeout=function(fn,ms){var g=gen;return st(function(){if(g===gen)fn();},ms);};
 window.setInterval=function(fn,ms){var g=gen,id=si(function(){if(g!==gen){clearInterval(id);return;}fn();},ms);return id;};})();

(function(){
var vp=document.getElementById('viewport');
var W=vp.clientWidth,H=vp.clientHeight;
var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(45,W/H,0.1,50);
var renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(W,H);renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
vp.appendChild(renderer.domElement);

var ambL=new THREE.AmbientLight(0x667788,0.55);scene.add(ambL);
var hemiL=new THREE.HemisphereLight(0xaaccff,0x302518,0.4);scene.add(hemiL);
var sun=new THREE.DirectionalLight(0xfff2e0,0.65);sun.position.set(3,5,2);scene.add(sun);
var bgLayer=document.getElementById('bgLayer');
var lightLv=1,lightGoal=1;
function applyLight(){ambL.intensity=.55*lightLv;hemiL.intensity=.4*lightLv;sun.intensity=.65*lightLv;bgLayer.style.filter='brightness('+(.22+.78*lightLv).toFixed(3)+')';}
function setLight(g){lightGoal=g;}
// projecteur sur l'objet présenté (étape 1)
var spot=new THREE.SpotLight(0xfff1dc,0,14,.24,.85,1);spot.position.set(0,5.2,3.6);spot.target.position.set(0,1.0,.3);
scene.add(spot);scene.add(spot.target);
var spotLv=0,spotGoal=0;
var flameLight=new THREE.PointLight(0xff8a3d,0,4);scene.add(flameLight);
var jarLight=new THREE.PointLight(0xffffff,0,5);scene.add(jarLight);

function tableTex(){
 var c=document.createElement('canvas');c.width=c.height=1024;var x=c.getContext('2d');
 // base marble slab colour
 var base=x.createLinearGradient(0,0,1024,1024);
 base.addColorStop(0,'#efe9db');base.addColorStop(.5,'#e6dfcf');base.addColorStop(1,'#ddd5c2');
 x.fillStyle=base;x.fillRect(0,0,1024,1024);
 // strong fine grain noise
 var id=x.getImageData(0,0,1024,1024),d=id.data;
 for(var p=0;p<d.length;p+=4){
  var n=(Math.random()-.5)*30;
  d[p]+=n;d[p+1]+=n*.96;d[p+2]+=n*.9;
 }
 x.putImageData(id,0,0);
 // scattered stone flecks (granite look)
 for(var f=0;f<2600;f++){
  var fx=Math.random()*1024,fy=Math.random()*1024,fr=.5+Math.random()*2.2;
  var tone=Math.random();
  x.fillStyle=tone<.5?'rgba(90,82,66,'+(0.08+Math.random()*.18)+')':'rgba(250,247,240,'+(0.1+Math.random()*.25)+')';
  x.beginPath();x.arc(fx,fy,fr,0,Math.PI*2);x.fill();
 }
 // bold marble veins
 for(var v=0;v<16;v++){
  x.strokeStyle='rgba(110,98,78,'+(0.14+Math.random()*.22)+')';
  x.lineWidth=1.5+Math.random()*4.5;
  x.beginPath();
  var sx=Math.random()*1024,sy=Math.random()*1024;
  x.moveTo(sx,sy);
  for(var seg=0;seg<6;seg++){
   sx+=(Math.random()-.5)*260;sy+=(Math.random()-.5)*260;
   x.lineTo(sx,sy);
  }
  x.stroke();
  // thin bright highlight running alongside each vein
  x.strokeStyle='rgba(255,252,244,'+(0.05+Math.random()*.08)+')';
  x.lineWidth=.6;
  x.stroke();
 }
 // soft vignette toward the edge of the bench
 var vig=x.createRadialGradient(512,512,260,512,512,720);
 vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(35,30,20,.22)');
 x.fillStyle=vig;x.fillRect(0,0,1024,1024);
 var t=new THREE.CanvasTexture(c);t.anisotropy=renderer.capabilities.getMaxAnisotropy?renderer.capabilities.getMaxAnisotropy():4;
 return t;
}
var ground=new THREE.Mesh(new THREE.CircleGeometry(4,64),new THREE.MeshStandardMaterial({map:tableTex(),roughness:.55,metalness:0}));
ground.rotation.x=-Math.PI/2;scene.add(ground);

function glowTex(c1,c2){
 var c=document.createElement('canvas');c.width=c.height=128;var x=c.getContext('2d');
 var g=x.createRadialGradient(64,64,0,64,64,64);
 g.addColorStop(0,c1);g.addColorStop(.5,c2);g.addColorStop(1,'rgba(0,0,0,0)');
 x.fillStyle=g;x.fillRect(0,0,128,128);
 return new THREE.CanvasTexture(c);
}
var flameTex=glowTex('rgba(255,190,90,1)','rgba(255,120,30,.6)');
var sparkTex=glowTex('rgba(255,240,200,1)','rgba(255,160,40,.7)');
var shadowTex=glowTex('rgba(0,0,0,.55)','rgba(0,0,0,.25)');
var neutralTex=glowTex('rgba(255,255,255,1)','rgba(255,255,255,.55)');

function woodTex(){
 var c=document.createElement('canvas');c.width=32;c.height=256;var x=c.getContext('2d');
 x.fillStyle='#8a5a2e';x.fillRect(0,0,32,256);
 for(var i=0;i<10;i++){
  x.strokeStyle='rgba(60,35,15,'+(0.15+Math.random()*.25)+')';x.lineWidth=1+Math.random()*1.5;
  x.beginPath();var sx=Math.random()*32;x.moveTo(sx,0);
  for(var y=0;y<256;y+=20){sx+=(Math.random()-.5)*4;x.lineTo(sx,y);}
  x.stroke();
 }
 var t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function makeLabelTexture(formula,lines){
 var c=document.createElement('canvas');c.width=320;c.height=480;var x=c.getContext('2d');
 x.fillStyle='rgba(255,255,255,.96)';roundRect(x,4,4,312,472,24);x.fill();
 x.strokeStyle='rgba(0,0,0,.3)';x.lineWidth=6;roundRect(x,4,4,312,472,24);x.stroke();
 x.fillStyle='#111';x.textAlign='center';x.textBaseline='middle';
 x.font='bold 120px sans-serif';x.fillText(formula,160,170);
 x.font='bold 36px sans-serif';
 var ly=330;lines.forEach(function(l){x.fillText(l,160,ly);ly+=46;});
 return new THREE.CanvasTexture(c);
}
function shadowBlob(radius){
 var m=new THREE.Sprite(new THREE.SpriteMaterial({map:shadowTex,transparent:true,depthWrite:false}));
 m.scale.set(radius,radius*.4,1);m.position.y=.02;m.rotation.x=-Math.PI/2;return m;
}

var flames=[];
for(var i=0;i<3;i++){
 var s=new THREE.Sprite(new THREE.SpriteMaterial({map:flameTex,blending:THREE.AdditiveBlending,depthWrite:false,opacity:0}));
 s.scale.set(.5,.8,1);scene.add(s);flames.push(s);
}
function placeFlames(x,y,z){flames.forEach(function(f){f.position.set(x,y,z);});}

// --- burner (bec Bunsen : base "soucoupe retournée" + longue tige métallique, taille du bocal) ---

  c.position.copy(a).add(b).multiplyScalar(.5);

 function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
 for(var i=0;i<=N;i++){
  var th=i/N*Math.PI*2;var d=Math.abs(Math.atan2(Math.sin(th-.6),Math.cos(th-.6)));
  var base=d<1.3?.2:(d<1.9?.2+(d-1.3)/.6*1.4:1.65);
  var jag=d<1.3?(i%2?.06:0):(i%2?1:-.7)*(.1+rnd()*.35);
  hs.push(Math.max(.18,Math.min(1.8,base+jag)));
 }
 hs[N]=hs[0];
 for(var j=0;j<N;j++){
  var t0=j/N*Math.PI*2,t1=(j+1)/N*Math.PI*2;
  var x0=R*Math.sin(t0),z0=R*Math.cos(t0),x1=R*Math.sin(t1),z1=R*Math.cos(t1);

 var grp=new THREE.Group();

var GAS_N=70,GAS_M=46,gasPuffs=[],gasMols=[];
var gasAmt=0,gasFrac=1,gasColA=new THREE.Color(0x7fe0ff),gasColB=new THREE.Color(0xff5fa8),gasT=0,gasHidden=true;
(function(){
 var seed=11;function rn(){seed=(seed*9301+49297)%233280;return seed/233280;}
 for(var i=0;i<GAS_N;i++){
  var r=Math.sqrt(rn())*.52,th=rn()*6.283,sc=.5+rn()*.5;
  var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:neutralTex,color:0xffffff,transparent:true,depthWrite:false,opacity:0}));
  sp.scale.set(sc,sc,1);sp.visible=false;jarGroup.add(sp);
  gasPuffs.push({o:sp,r:r,th:th,y:.34+rn()*1.34,ph:rn()*6.283,s:.35+rn()*.6,sc:sc,u:rn()});
 }
 for(var j=0;j<GAS_M;j++){
  var sm=new THREE.Sprite(new THREE.SpriteMaterial({map:neutralTex,color:0xffffff,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:0}));
  sm.scale.set(.085,.085,1);sm.visible=false;jarGroup.add(sm);
  var a=rn()*6.283,rr=Math.sqrt(rn())*.55,v=.25+rn()*.45,b=rn()*6.283;
  gasMols.push({o:sm,x:rr*Math.cos(a),y:.35+rn()*1.3,z:rr*Math.sin(a),vx:Math.cos(b)*v,vy:(rn()-.5)*v*1.6,vz:Math.sin(b)*v});
 }
})();
function gasReset(){gasAmt=0;gasFrac=1;gasHidden=false;}
var _gc=new THREE.Color();
function gasUpdate(dt){
 gasT+=dt;
 if(gasAmt<=0.0005){
  if(!gasHidden){gasPuffs.forEach(function(p){p.o.visible=false;p.o.material.opacity=0;});gasMols.forEach(function(m){m.o.visible=false;m.o.material.opacity=0;});gasHidden=true;}
  return;
 }
 gasHidden=false;
 for(var i=0;i<GAS_N;i++){
  var p=gasPuffs[i];
  var w=Math.max(0,Math.min(1,(gasAmt*(GAS_N+8)-i)/8));
  if(w<=0){p.o.visible=false;continue;}
  p.o.visible=true;
  var e=1-w;e=e*e; // la volute arrive par le haut puis se répand
  var th=p.th+gasT*.18*p.s;
  var bx=p.r*Math.cos(th),bz=p.r*Math.sin(th);
  var by=p.y+Math.sin(gasT*p.s*1.3+p.ph)*.07;
  p.o.position.set(bx*(1-e),by+(1.78-by)*e,bz*(1-e));
  var pulse=1+.12*Math.sin(gasT*p.s*1.7+p.ph);
  p.o.scale.set(p.sc*pulse*(.6+.4*w),p.sc*pulse*(.6+.4*w),1);
  p.o.material.color.copy(p.u<gasFrac?gasColA:gasColB);
  p.o.material.opacity=GAS_OP*w;
 }
 for(var j=0;j<GAS_M;j++){
  var m=gasMols[j];
  var wm=Math.max(0,Math.min(1,(gasAmt*(GAS_M+6)-j)/6));
  if(wm<=0){m.o.visible=false;continue;}
  m.o.visible=true;
  m.x+=m.vx*dt;m.y+=m.vy*dt;m.z+=m.vz*dt;
  var rr=Math.sqrt(m.x*m.x+m.z*m.z);
  if(rr>.62){var nx=m.x/rr,nz=m.z/rr,dp=m.vx*nx+m.vz*nz;m.vx-=2*dp*nx;m.vz-=2*dp*nz;m.x=nx*.62;m.z=nz*.62;}
  if(m.y<.32){m.y=.32;m.vy=Math.abs(m.vy);}
  if(m.y>1.72){m.y=1.72;m.vy=-Math.abs(m.vy);}
  m.o.position.set(m.x,m.y,m.z);
  _gc.copy(j/GAS_M<gasFrac?gasColA:gasColB);
  m.o.material.color.copy(_gc);
  m.o.material.opacity=.95*wm;
 }
}

function scatterPositions(n,minDist){
 var pts=[];
 for(var tries=0;pts.length<n&&tries<6000;tries++){
  var x=(Math.random()-.5)*6,z=(Math.random()-.5)*4;
  if(Math.sqrt(x*x+z*z*1.6)>3.1)continue;
  var ok=true;
  for(var i=0;i<pts.length;i++){var dx=pts[i].x-x,dz=pts[i].z-z;if(Math.sqrt(dx*dx+dz*dz)<minDist){ok=false;break;}}
  if(ok)pts.push({x:x,z:z});
 }
 while(pts.length<n)pts.push({x:(Math.random()-.5)*5,z:(Math.random()-.5)*3});
 return pts;
}

 cr.mats.forEach(function(m){m.emissive.setHex(hex);m.color.setHex(hex);m.emissiveIntensity=(.25+1.6*fl)*k+.25*(1-k);});
 cr.glows.forEach(function(g,gi){var sc=(gi===0?1.5:.9)*(.7+fl*.6)*k+.05;g.scale.set(sc,sc,1);g.material.color.setHex(hex);g.material.opacity=Math.min(1,k*(.7+.3*fl))+.0;});
 var cs=(1.0+1.8*fl)*k+.01;cr.core.scale.set(cs,cs,1);cr.core.material.color.setHex(hex);cr.core.material.opacity=k;
 tintMat.color.setHex(hex);tintMat.opacity=(.1+.4*fl)*k+0;
 cr.acc+=dt*110*k;
 while(cr.acc>=1){cr.acc-=1;spawnCrackleSpark(cr.tip,CR_COLS[(Math.random()*CR_COLS.length)|0],jp);}
 if(cr.t>=cr.dur+cr.fade){
  jarLight.intensity=0;scene.remove(cr.core);
  cr.mats.forEach(function(m){m.emissive.setHex(0xff3a10);m.emissiveIntensity=.25;});
  cr.glows.forEach(function(g,gi){g.material.color.setHex(0xffffff);g.material.opacity=.2;var sc=gi===0?.35:.2;g.scale.set(sc,sc,1);});
  if(cr.restore)cr.restore();else{tintMat.color.setHex(GAS_TINT.O2.color);tintMat.opacity=GAS_TINT.O2.op*.5;}
  crackle=null;
 }
}

document.getElementById('btnPlunge2').addEventListener('click',function(){
 this.style.display='none';
 tweenTo(lidGroup,HOME.lidGroup,1,.5);
 var obj=activeHeatObj;var mats=activeMats,glows=activeGlows;
 setLight(.1); // la pièce passe dans la pénombre : l'objet incandescent ressort
 setTimeout(function(){
  plungeObject(obj,function(){
   var tip=objTip();var obs=document.getElementById('obs2');
   if(lockedGas==='O2'){
    startCrackle(mats,glows,tip,3);

     mats.forEach(function(m,mi){m.emissiveIntensity=e0[mi]*(1-k);});
     glows.forEach(function(g){g.material.opacity=Math.max(0,g.material.opacity*(1-k));});
    },function(){
     mats.forEach(function(m){m.emissiveIntensity=0;m.emissive.setHex(0x000000);});
     tipMat.color.setHex(0x1a1a1a);charMat.color.setHex(0x232323);stickMat.color.setHex(0xb89a7a);
     glows.forEach(function(g){g.material.opacity=0;});

    spawnSmoke(new THREE.Vector3(tip.x,.95,tip.z),12);

document.getElementById('btnShake2').addEventListener('click',function(){
 this.style.display='none';
 var obj=activeHeatObj;
 // l'objet reste dans le bocal et suit ses mouvements
 if(obj===splintGroup)addAnim(.3,function(k){obj.position.y=lerp(1.95,1.78,k);});

// --- tab 3 : Explosif ---
var o2mix=document.getElementById('o2mix'),o2mixval=document.getElementById('o2mixval'),h2mixval=document.getElementById('h2mixval');
var h2mix={get value(){return 100-(+o2mix.value);},set disabled(v){o2mix.disabled=v;}};
function updMixLabels(){o2mixval.textContent='O₂ '+o2mix.value+'%';h2mixval.textContent='H₂ '+(100-o2mix.value)+'%';o2mix.style.setProperty('--p',o2mix.value+'%');}
o2mix.addEventListener('input',updMixLabels);updMixLabels();
function resetMixTab(){
 crackle=null;jarLight.intensity=0;setLight(1);
 if(splintGroup.parent===jarGroup)scene.attach(splintGroup);
 jarGroup.rotation.set(0,0,0);jarGroup.position.set(HOME.jarGroup.x,0,HOME.jarGroup.z);
 jarGroup.visible=true;lidGroup.visible=true;lidGroup.rotation.set(0,0,0);
 jar.visible=true;jarRim.visible=true;jarBase.visible=true;
 tweenTo(lidGroup,HOME.lidGroup,1,.01);
 resetTints();
 [[o2BottleGroup,HOME.o2BottleGroup],[h2BottleGroup,HOME.h2BottleGroup]].forEach(function(pr){
  var b=pr[0],h=pr[1];b.userData.flip.rotation.x=0;b.scale.setScalar(1);b.position.set(h.x,h.y,h.z);setShadow(b,true);
 });
 o2mix.disabled=false;brokenJar.visible=false;
 document.getElementById('fillMix').style.display='block';
 ['closeMix','igniteBurnerMix','heatSplintMix','heatingRowMix','plungeMix','obs3','retryMix'].forEach(function(id){document.getElementById(id).style.display='none';});
 tipMat.color.setHex(0x1a1a1a);tipMat.emissive.setHex(0x000000);tipMat.emissiveIntensity=0;
 stickMat.color.setHex(0xffffff);stickMat.emissive.setHex(0x000000);stickMat.emissiveIntensity=0;
 splintGlows.forEach(function(g){g.material.opacity=0;g.material.color.setHex(0xffffff);g.scale.set(.01,.01,1);});
 shardsArr.forEach(function(s){scene.remove(s.o);});shardsArr=[];
 splintGroup.rotation.set(0,0,0);setShadow(splintGroup,true);
 splintGroup.position.set(HOME.splintGroup.x,0,HOME.splintGroup.z);splintGroup.scale.setScalar(1);
}
var lastMixColor=new THREE.Color(0x8f98b5);
document.getElementById('fillMix').addEventListener('click',function(){
 lockedH2=+h2mix.value;var lockedO2=100-lockedH2;var a=lockedO2/100,bb=1-a;
 o2mix.disabled=true;h2mix.disabled=true;this.style.display='none';
 var c1=new THREE.Color(0x1fd0c0),c2=new THREE.Color(0xff5fa8);
 var mix=c1.clone().lerpHSL(c2,lockedH2/100);lastMixColor=mix.clone();
 gasReset();gasColA.copy(c1);gasColB.copy(c2);gasFrac=a;tintMat.opacity=0;tint2Mat.opacity=0;setLayer(tint,0,1);setLayer(tint2,0,1);tintMat.color.copy(c1);
 var queue=[];
 if(lockedO2>0)queue.push('o2');
 if(lockedH2>0)queue.push('h2');
 function afterAll(){
  addAnim(.9,function(k){
   gasColA.copy(c1).lerp(mix,k);gasColB.copy(c2).lerp(mix,k);gasAmt=1;
   tintMat.color.copy(mix);tintMat.opacity=.07*k;tint2Mat.opacity=0;
  },function(){
   gasColA.copy(mix);gasColB.copy(mix);gasAmt=1;tintMat.color.copy(mix);tintMat.opacity=.07;tint2Mat.opacity=0;
   document.getElementById('closeMix').style.display='block';
  });
 }
 function next(i){
  if(i>=queue.length){afterAll();return;}
  if(queue[i]==='o2'){
   pourBottle(o2BottleGroup,HOME.o2BottleGroup,0x7fe0ff,0,.6+2.2*a,function(k){gasAmt=a*k;},function(){next(i+1);});
  } else {
   pourBottle(h2BottleGroup,HOME.h2BottleGroup,0xff8fc0,0,.6+2.2*bb,function(k){gasAmt=a+bb*k;},function(){next(i+1);});
  }
 }
 next(0);
});
document.getElementById('closeMix').addEventListener('click',function(){
 this.style.display='none';
 tweenTo(lidGroup,LID_ON,1,.6,function(){document.getElementById('igniteBurnerMix').style.display='block';});
});
document.getElementById('igniteBurnerMix').addEventListener('click',function(){
 this.style.display='none';burnerOn=true;
 placeFlames(HOME.burnerGroup.x,BURNER_FLAME_Y,HOME.burnerGroup.z);
 document.getElementById('heatSplintMix').style.display='block';
});
document.getElementById('heatSplintMix').addEventListener('click',function(){
 this.style.display='none';
 heatObjectFlow(splintGroup,'la bûchette',[tipMat,stickMat],splintGlows,.7,'heatingRowMix','heatPctMix','plungeMix',function(){});
});
document.getElementById('plungeMix').addEventListener('click',function(){
 this.style.display='none';
 tweenTo(lidGroup,HOME.lidGroup,1,.5);
 var o2rich=lockedH2<20;
 if(o2rich)setLight(.1);
 setTimeout(function(){
  var jarPos=HOME.jarGroup;
  plungeObject(splintGroup,function(){
   var explosive=lockedH2>=20&&lockedH2<=75;
   var obs=document.getElementById('obs3');
   if(explosive){
    bigFlash(jarPos,10);
    jarLight.position.set(jarPos.x,1.1,0);jarLight.distance=5;jarLight.color.setHex(0xffdd66);jarLight.intensity=18;
    var f=0;var fadeJ=setInterval(function(){f++;jarLight.intensity=Math.max(0,jarLight.intensity-18/20);if(f>=20)clearInterval(fadeJ);},30);
    shakeCam(.5,1.1);
    jar.visible=false;jarRim.visible=false;brokenJar.visible=true;lidGroup.visible=false;tintMat.opacity=0;tint2Mat.opacity=0;gasReset();
    spawnShards(jarPos,16);
    sparkStorm(jarPos,1.2,2.6);
    obs.textContent='BOOM ! Dans cette zone de proportions, le mélange dihydrogène / dioxygène est explosif.';
   } else if(o2rich){
    startCrackle([tipMat,stickMat],splintGlows,objTip(),3,function(){tintMat.color.copy(lastMixColor);tintMat.opacity=.07;});
    setTimeout(function(){setLight(1);},4300);
    obs.textContent='Pas d\'explosion : le mélange est très riche en O₂, la bûchette se rallume avec un éclat intense.';
   } else {
    placeFlames(jarPos.x,.85,0);
    flames.forEach(function(f){f.material.opacity=.6;});
    var d=0;var dim=setInterval(function(){d++;flames.forEach(function(f){f.material.opacity=Math.max(0,f.material.opacity-.03);});if(d>25)clearInterval(dim);},16);
    tipMat.emissiveIntensity=0;tipMat.color.setHex(0x1a1a1a);stickMat.emissiveIntensity=0;stickMat.color.setHex(0xb89a7a);splintGlows.forEach(function(g){g.material.opacity=0;});
    obs.textContent='Pas d\'explosion : dans ces proportions, le mélange ne réagit pas violemment.';
   }
   obs.style.display='block';
   document.getElementById('retryMix').style.display='block';
  });
 },550);
});
document.getElementById('retryMix').addEventListener('click',resetMixTab);

// --- animation loop ---
var lastT=Date.now();
function animate(){
 requestAnimationFrame(animate);
 var now=Date.now();var dt=(now-lastT)/1000;lastT=now;

 tweenTargets.forEach(function(o){
  var tw=o.userData.tw;
  if(tw){
   tw.t+=dt;var k=Math.min(1,tw.t/tw.dur);var e=smooth(k);
   o.position.lerpVectors(tw.fp,tw.tp,e);o.scale.setScalar(lerp(tw.fs,tw.ts,e));
   if(k>=1){delete o.userData.tw;tw.onDone&&tw.onDone();}
  }
  if(step===0&&o===introOrder[introIndex]){o.rotation.y+=dt*1.6;}
  else if(step===0){o.rotation.y+=dt*.25;}
 });

 for(var ai=arcMoving.length-1;ai>=0;ai--){
  var a=arcMoving[ai];a.t+=dt;var k2=Math.min(1,a.t/a.dur);var e2=smooth(k2);
  a.o.position.lerpVectors(a.from,a.to,e2);a.o.position.y+=a.peak*4*k2*(1-k2);
  if(k2>=1){arcMoving.splice(ai,1);a.onDone&&a.onDone();}
 }

 if(jarGroup.userData.shakeT!==undefined&&jarGroup.userData.shakeT<jarGroup.userData.shakeDur){
  jarGroup.userData.shakeT+=dt;
  var done=jarGroup.userData.shakeT>=jarGroup.userData.shakeDur;
  var ang=done?0:Math.sin(now*.03)*(jarGroup.userData.shakeAmp||.05);
  var dxs=done?0:Math.sin(now*.047)*.06;
  jarGroup.rotation.z=ang;jarGroup.position.x=HOME.jarGroup.x+dxs;
  // le couvercle est solidaire du bocal
  lidGroup.position.set(HOME.jarGroup.x+dxs-LID_ON.y*Math.sin(ang),LID_ON.y*Math.cos(ang),HOME.jarGroup.z);
  lidGroup.rotation.z=ang;
  if(done){
   jarGroup.userData.shakeT=undefined;lidGroup.position.set(LID_ON.x,LID_ON.y,LID_ON.z);lidGroup.rotation.z=0;
   jarGroup.updateMatrixWorld(true);
   if(jarGroup.userData.carry){scene.attach(jarGroup.userData.carry);jarGroup.userData.carry=null;}
  }
 }

 for(var i2=sparks.length-1;i2>=0;i2--){
  var sp=sparks[i2];sp.life-=dt;sp.vy-=dt*1.2;
  sp.o.position.x+=sp.vx*dt;sp.o.position.y+=sp.vy*dt;sp.o.position.z+=sp.vz*dt;
  var rx=sp.o.position.x-sp.jx,rz=sp.o.position.z-sp.jz;var d2=Math.sqrt(rx*rx+rz*rz);
  if(d2>.78){sp.vx*=-.5;sp.vz*=-.5;}
  if(sp.o.position.y<.15){sp.o.position.y=.15;sp.vy*=-.4;}
  if(sp.o.position.y>1.85){sp.o.position.y=1.85;sp.vy*=-.4;}
  sp.o.material.opacity=Math.max(0,sp.life);
  if(sp.life<=0){scene.remove(sp.o);sparks.splice(i2,1);}
 }
 for(var j=jets.length-1;j>=0;j--){
  var je=jets[j];je.life-=dt;je.o.position.x+=je.vx*dt;je.o.position.y+=je.vy*dt;je.o.position.z+=je.vz*dt;je.o.material.opacity=Math.max(0,je.life);
  if(je.life<=0){scene.remove(je.o);jets.splice(j,1);}
 }
 for(var sm=smokes.length-1;sm>=0;sm--){
  var s2=smokes[sm];s2.life-=dt;s2.o.position.x+=s2.vx*dt;s2.o.position.y+=s2.vy*dt;s2.o.position.z+=s2.vz*dt;
  var sc=s2.o.scale.x+s2.grow*dt;s2.o.scale.set(sc,sc,1);s2.o.material.opacity=Math.max(0,Math.min(.55,s2.life*.4));
  if(s2.life<=0){scene.remove(s2.o);smokes.splice(sm,1);}
 }
 for(var b=burstSprites.length-1;b>=0;b--){
  var bs=burstSprites[b];bs.life-=dt*1.4;var sc2=bs.o.scale.x*(1+bs.grow*dt);bs.o.scale.set(sc2,sc2,1);bs.o.material.opacity=Math.max(0,bs.life);
  if(bs.life<=0){scene.remove(bs.o);burstSprites.splice(b,1);}
 }
 for(var sh=shardsArr.length-1;sh>=0;sh--){
  var sd=shardsArr[sh];sd.life-=dt;sd.vy-=9*dt;
  sd.o.position.x+=sd.vx*dt;sd.o.position.y+=sd.vy*dt;sd.o.position.z+=sd.vz*dt;
  sd.o.rotation.x+=sd.ax*dt;sd.o.rotation.y+=sd.ay*dt;sd.o.rotation.z+=sd.az*dt;
  if(sd.o.position.y<.05){sd.o.position.y=.05;sd.vy*=-.3;sd.vx*=.6;sd.vz*=.6;}
  if(sd.life<.6&&sd.o.material.opacity!==undefined){sd.o.material.transparent=true;sd.o.material.opacity=Math.max(0,sd.life/.6*(sd.o.material.userData&&sd.o.material.userData.baseOp||1));}
  if(sd.life<=0){scene.remove(sd.o);shardsArr.splice(sh,1);}
 }

 if(camShake){
  camShake.t+=dt;var damp=Math.max(0,1-camShake.t/camShake.dur);
  if(damp<=0){camShake=null;updCam();}
  else{updCam();camera.position.x+=(Math.random()-.5)*camShake.amp*damp;camera.position.y+=(Math.random()-.5)*camShake.amp*damp*.6;}
 }

 if(step===1||step===3){
  flames.forEach(function(f,i){f.material.opacity=burnerOn?(.55+Math.sin(now*.01+i)*.15):Math.max(0,f.material.opacity*.9);f.scale.set(.45+Math.sin(now*.02+i)*.08,.75+Math.sin(now*.015+i)*.1,1);});
  flameLight.position.set(HOME.burnerGroup.x,BURNER_FLAME_Y,HOME.burnerGroup.z);
  flameLight.intensity=burnerOn?1.2+Math.sin(now*.02)*.2:Math.max(0,flameLight.intensity*.9);
 }
 for(var an=anims.length-1;an>=0;an--){
  var A=anims[an];A.t+=dt;var ak=Math.min(1,A.t/A.dur);A.fn(ak,dt);
  if(ak>=1){anims.splice(an,1);A.onDone&&A.onDone();}
 }
 updateCrackle(dt);
 gasUpdate(dt);
 if(Math.abs(spotGoal-spotLv)>.01){spotLv+=(spotGoal-spotLv)*Math.min(1,dt*4);spot.intensity=spotLv;}
 else if(spot.intensity!==spotGoal){spotLv=spotGoal;spot.intensity=spotGoal;}
 if(Math.abs(lightGoal-lightLv)>.002){lightLv+=(lightGoal-lightLv)*Math.min(1,dt*4);applyLight();}
 else if(lightLv!==lightGoal){lightLv=lightGoal;applyLight();}
 if(Math.abs(camGoalY-ty)>.002&&!camShake){ty+=(camGoalY-ty)*Math.min(1,dt*3);updCam();}
 [o2BottleGroup,h2BottleGroup,co2BottleGroup].forEach(function(bt){
  var gs=Math.max(.05,bt.scale.x);var tg=bt.userData.tag;
  var presented=(step===0&&introIndex>=0&&introIndex<introOrder.length&&introOrder[introIndex]===bt);
  tg.material.opacity=(spotGoal>0&&!presented)?.2:1;
  tg.scale.set(1.4/gs,.41/gs,1);tg.position.y=BTL_TIPH+.5/gs;
 });
 renderer.render(scene,camera);
}
animate();
})();
</script>
